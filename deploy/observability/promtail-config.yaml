server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kbase-rag
    static_configs:
      - targets: [localhost]
        labels:
          job: kbase-rag
          service_name: kbase-rag
          __path__: /app/logs/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: record.level.name
            trace_id: record.extra.trace_id
            span_id: record.extra.span_id
            session_id: record.extra.session_id
            task_id: record.extra.task_id
            graph: record.extra.graph
            node_name: record.extra.node_name
      - labels:
          level:
          trace_id:
          graph:
          node_name:
